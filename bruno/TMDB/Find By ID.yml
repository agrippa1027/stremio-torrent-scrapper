info:
  name: Find By ID
  type: http
  seq: 1

http:
  method: GET
  url: https://api.themoviedb.org/3/find/tt0133093?external_source=imdb_id&language=en-US
  headers:
    - name: Authorization
      value: Bearer {{TMDBID}}
    - name: accept
      value: application/json
  params:
    - name: external_source
      value: imdb_id
      type: query
    - name: language
      value: en-US
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
